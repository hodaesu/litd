name: Rapport de bug
description: Signaler un problème reproductible
title: "[BUG] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes pour reproduire
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.12.0
