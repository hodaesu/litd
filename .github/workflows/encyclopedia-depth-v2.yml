name: Encyclopedia Depth V2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encyclopedia-depth-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Audit encyclopedia depth V2
        run: python -m tools.qa.encyclopedia_depth_v2_audit
      - name: Contract tests encyclopedia depth V2
        run: python -m pytest -q tests/test_encyclopedia_depth_v2.py
