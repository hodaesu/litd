name: Veilleurs v0.7 Production

on:
  push:
    branches:
      - feat/veilleurs-production-wave-1
  pull_request:
    paths:
      - 'data/veilleurs/v07/**'
      - 'data/veilleurs/v08/canonical_watcher_ultimates_12.json'
      - 'scripts/core/veilleurs_*.gd'
      - 'scenes/tests/veilleurs_v07_*'
      - 'tools/qa/veilleurs_v07_*'
      - '.github/workflows/veilleurs-v07-production.yml'
  workflow_dispatch:

concurrency:
  group: veilleurs-v07-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content-audit:
    name: v0.7 content contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audit production content
        run: python tools/qa/veilleurs_v07_content_audit.py
      - name: Preserve v0.6 Tests_48
        run: python tools/qa/veilleurs_v06_tests48.py

  godot-production:
    name: Godot 4.7 v0.7 production smoke
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Strict Godot import
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import --quit 2>&1 | tee /tmp/v07-import.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|ERROR: Failed to create an autoload|ERROR: Failed to instantiate an autoload|ERROR: FATAL:|handle_crash: Program crashed' /tmp/v07-import.log
      - name: Run v0.7 production smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 90s godot --headless --path . res://scenes/tests/veilleurs_v07_production_smoke.tscn 2>&1 | tee /tmp/v07-smoke.log
          ! grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|ERROR: FATAL:|handle_crash: Program crashed|VEILLEURS_V07_PRODUCTION_SMOKE_FAILED' /tmp/v07-smoke.log
          grep -F 'VEILLEURS_V07_PRODUCTION_SMOKE_OK' /tmp/v07-smoke.log
