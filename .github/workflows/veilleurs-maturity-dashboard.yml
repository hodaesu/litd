name: Veilleurs Maturity Dashboard

on:
  pull_request:
    paths:
      - 'data/veilleurs/system_maturity_registry.json'
      - 'data/veilleurs/player_validation_contract.json'
      - 'data/veilleurs/hardware_validation_contract.json'
      - 'tools/qa/veilleurs_maturity_dashboard.py'
      - 'tests/test_veilleurs_maturity_dashboard.py'
      - 'tools/qa/audit.py'
      - 'docs/veilleurs/MATURITY_DASHBOARD.md'
      - '.github/workflows/veilleurs-maturity-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'data/veilleurs/system_maturity_registry.json'
      - 'data/veilleurs/player_validation_contract.json'
      - 'data/veilleurs/hardware_validation_contract.json'
      - 'tools/qa/veilleurs_maturity_dashboard.py'
      - 'tests/test_veilleurs_maturity_dashboard.py'
      - 'tools/qa/audit.py'
      - 'docs/veilleurs/MATURITY_DASHBOARD.md'
      - '.github/workflows/veilleurs-maturity-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    name: Generate maturity dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate dashboard contract
        run: python -m tools.qa.veilleurs_maturity_dashboard --check
      - name: Test dashboard tooling
        run: python -m pytest -q tests/test_veilleurs_maturity_dashboard.py
      - name: Generate dashboard
        run: python -m tools.qa.veilleurs_maturity_dashboard --out build/qa/veilleurs_maturity_dashboard.json
      - name: Assert no automatic maturity promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('build/qa/veilleurs_maturity_dashboard.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          for system in data['systems']:
              assert system['stage'] in {
                  'implemented',
                  'technically_validated',
                  'player_validated',
                  'mobile_validated',
                  'production_locked',
              }
          registry = json.loads(Path('data/veilleurs/system_maturity_registry.json').read_text(encoding='utf-8'))
          by_id = {s['id']: s['current_stage'] for s in registry['systems']}
          assert {s['id']: s['stage'] for s in data['systems']} == by_id
          print('VEILLEURS_MATURITY_NO_PROMOTION_OK')
          PY
      - name: Publish maturity dashboard
        uses: actions/upload-artifact@v4
        with:
          name: veilleurs-maturity-dashboard
          path: build/qa/veilleurs_maturity_dashboard.json
          if-no-files-found: error
