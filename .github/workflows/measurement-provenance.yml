name: Measurement Provenance

on:
  workflow_run:
    workflows: ["Balance Telemetry"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: measurement-provenance-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current governance tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installer les dépendances QA
        run: python -m pip install -r requirements-dev.txt
      - name: Download Balance Telemetry artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: upstream-artifacts
      - name: Build immutable measurement candidates and canonical design diagnostics
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_RUN_ID: ${{ github.event.workflow_run.id }}
          GITHUB_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          GITHUB_WORKFLOW: Balance Telemetry
          GITHUB_JOB: measurement-provenance
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/measurement-candidates
          found=0
          while IFS= read -r -d '' report; do
            found=1
            name="$(basename "$report" .json)"
            python -m tools.quality.measurement_collector "$report" \
              --targets docs/knowledge/design-targets.json \
              --output "reports/measurement-candidates/${name}.measurement.json"
          done < <(find upstream-artifacts -type f -name '*.json' -print0)
          if [ "$found" -eq 0 ]; then
            echo 'No JSON telemetry reports were downloaded.' >&2
            exit 1
          fi
      - name: Download prior successful measurement history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline-history/zips baseline-history/extracted
          runs_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/measurement-provenance.yml/runs?status=success&per_page=20")"
          mapfile -t run_ids < <(python -c 'import json,sys; data=json.load(sys.stdin); [print(r["id"]) for r in data.get("workflow_runs", [])]' <<< "$runs_json")
          for run_id in "${run_ids[@]:-}"; do
            artifacts_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts")"
            mapfile -t artifact_ids < <(python -c 'import json,sys; data=json.load(sys.stdin); [print(a["id"]) for a in data.get("artifacts", []) if a.get("name", "").startswith("measurement-candidates-")]' <<< "$artifacts_json")
            for artifact_id in "${artifact_ids[@]:-}"; do
              zip_path="baseline-history/zips/${run_id}-${artifact_id}.zip"
              if gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$zip_path"; then
                mkdir -p "baseline-history/extracted/${run_id}-${artifact_id}"
                unzip -q -o "$zip_path" -d "baseline-history/extracted/${run_id}-${artifact_id}"
              fi
            done
          done
          echo "Historical candidate files: $(find baseline-history/extracted -type f -name '*.measurement.json' | wc -l)"
      - name: Build compatibility-safe longitudinal measurement history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          mapfile -d '' history_candidates < <(find baseline-history/extracted reports/measurement-candidates -type f -name '*.measurement.json' -print0)
          if [ "${#history_candidates[@]}" -eq 0 ]; then
            echo 'No measurement candidates available for longitudinal history.' >&2
            exit 1
          fi
          python -m tools.quality.measurement_history "${history_candidates[@]}" \
            --output reports/measurement-history.json
      - name: Bind measurements to effective target snapshots
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t snapshots < <(find docs/knowledge/target-history -type f -name '*.json' | sort)
          if [ "${#snapshots[@]}" -eq 0 ]; then
            echo 'Target history is empty.' >&2
            exit 1
          fi
          python -m tools.quality.measurement_target_binding \
            --snapshots "${snapshots[@]}" \
            --measurement-history reports/measurement-history.json \
            --output reports/measurement-target-binding.json
      - name: Analyze target goalpost drift against target-bound measurement history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          mapfile -t snapshots < <(find docs/knowledge/target-history -type f -name '*.json' | sort)
          if [ "${#snapshots[@]}" -eq 0 ]; then
            echo 'Target history is empty.' >&2
            exit 1
          fi
          python -m tools.quality.goalpost_drift_analyzer \
            --snapshots "${snapshots[@]}" \
            --measurement-history reports/measurement-history.json \
            --target-binding reports/measurement-target-binding.json \
            --output reports/goalpost-drift.json
      - name: Build governed goalpost review candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f reports/goalpost-drift.json ]; then
            echo 'No goalpost drift report available; skipping review candidate.'
            exit 0
          fi
          python -m tools.quality.goalpost_review_candidate \
            reports/goalpost-drift.json \
            --output reports/goalpost-review-candidate.json
      - name: Select compatible baseline and build before-after design comparison
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/measurement-comparisons
          mapfile -d '' priors < <(find baseline-history/extracted -type f -name '*.measurement.json' -print0)
          while IFS= read -r -d '' current; do
            name="$(basename "$current" .measurement.json)"
            args=(--current "$current" --targets docs/knowledge/design-targets.json --output "reports/measurement-comparisons/${name}.comparison.json")
            if [ "${#priors[@]}" -gt 0 ]; then
              args+=(--prior "${priors[@]}")
            fi
            python -m tools.quality.baseline_comparison "${args[@]}"
          done < <(find reports/measurement-candidates -type f -name '*.measurement.json' -print0)
      - name: Verify measurement mapping, history, target binding, goalpost, review-candidate, baseline, PR summary, gate and collector contracts
        run: >-
          python -m pytest -q
          tests/python/test_telemetry_target_mapper.py
          tests/python/test_design_target_evaluator.py
          tests/python/test_measurement_collector.py
          tests/python/test_measurement_history.py
          tests/python/test_measurement_target_binding.py
          tests/python/test_goalpost_drift_analyzer.py
          tests/python/test_goalpost_review_candidate.py
          tests/python/test_baseline_selector.py
          tests/python/test_baseline_comparison.py
          tests/python/test_design_decision_candidate.py
          tests/python/test_pr_design_summary.py
          tests/python/test_design_regression_gate.py
      - name: Upload provenance-ready measurements
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurement-candidates-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: reports/measurement-candidates/*.measurement.json
          if-no-files-found: warn
      - name: Upload longitudinal measurement history
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurement-history-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: reports/measurement-history.json
          if-no-files-found: warn
      - name: Upload measurement to target binding
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurement-target-binding-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: reports/measurement-target-binding.json
          if-no-files-found: warn
      - name: Upload goalpost drift diagnostic
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goalpost-drift-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: reports/goalpost-drift.json
          if-no-files-found: warn
      - name: Upload governed goalpost review candidate
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goalpost-review-candidate-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: reports/goalpost-review-candidate.json
          if-no-files-found: warn
      - name: Upload baseline comparisons
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurement-comparisons-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: reports/measurement-comparisons/*.comparison.json
          if-no-files-found: warn
      - name: Build design review candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' comparisons < <(find reports/measurement-comparisons -type f -name '*.comparison.json' -print0)
          if [ "${#comparisons[@]}" -eq 0 ]; then
            exit 0
          fi
          python -m tools.quality.design_decision_candidate "${comparisons[@]}" \
            --output reports/design-review-candidate.json
      - name: Upload design review candidate
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-review-candidate-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: reports/design-review-candidate.json
          if-no-files-found: warn
      - name: Build Pull Request design summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' comparisons < <(find reports/measurement-comparisons -type f -name '*.comparison.json' -print0)
          if [ "${#comparisons[@]}" -eq 0 ]; then
            exit 0
          fi
          python -m tools.quality.pr_design_summary "${comparisons[@]}" \
            --upstream-run-id "${{ github.event.workflow_run.id }}" \
            --output reports/pr-design-summary.md
      - name: Upload Pull Request design summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-design-summary-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: reports/pr-design-summary.md
          if-no-files-found: warn
      - name: Publish or update Pull Request design summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ] || [ ! -f reports/pr-design-summary.md ]; then
            echo 'No Pull Request associated with upstream telemetry run; skipping PR comment.'
            exit 0
          fi
          comments="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100")"
          existing_id="$(python -c 'import json,sys; rows=json.load(sys.stdin); print(next((row["id"] for row in rows if "<!-- litd-design-telemetry-summary -->" in row.get("body", "")), ""))' <<< "$comments")"
          body="$(cat reports/pr-design-summary.md)"
          if [ -n "$existing_id" ]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" -f body="$body" >/dev/null
            echo "Updated LITD design summary comment ${existing_id} on PR #${PR_NUMBER}."
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
            echo "Created LITD design summary comment on PR #${PR_NUMBER}."
          fi
      - name: Enforce high-severity design regression gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' comparisons < <(find reports/measurement-comparisons -type f -name '*.comparison.json' -print0)
          if [ "${#comparisons[@]}" -eq 0 ]; then
            echo 'No comparison artifacts available; refusing to invent a regression.'
            exit 0
          fi
          python -m tools.quality.design_regression_gate "${comparisons[@]}" \
            --report reports/design-regression-gate.json
      - name: Upload design regression gate report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-regression-gate-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: reports/design-regression-gate.json
          if-no-files-found: warn
