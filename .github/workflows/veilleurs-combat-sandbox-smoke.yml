name: Veilleurs Combat Sandbox Smoke

on:
  pull_request:
    paths:
      - 'data/veilleurs/canonical_roster.json'
      - 'data/veilleurs/combat_sandbox_quartet_bridge.json'
      - 'data/veilleurs/skills/current_quartet_export_contract.json'
      - 'data/veilleurs/skills/mathilde.json'
      - 'data/veilleurs/skills/marec.json'
      - 'data/veilleurs/skills/anouk.json'
      - 'data/veilleurs/skills/aurelien.json'
      - 'scripts/core/veilleurs_combat_context_runtime.gd'
      - 'scripts/core/veilleurs_combat_sandbox_runtime.gd'
      - 'scripts/ui/main_v46.gd'
      - 'scripts/ui/main_v47.gd'
      - 'scripts/ui/main_v48.gd'
      - 'scripts/ui/main_v49.gd'
      - 'scripts/ui/main_v50.gd'
      - 'scripts/tests/current_quartet_skill_data_smoke_test.gd'
      - 'scripts/tests/veilleurs_combat_context_smoke_test.gd'
      - 'scripts/tests/veilleurs_combat_sandbox_loop_smoke_test.gd'
      - 'scripts/tests/veilleurs_systemic_skill_families_smoke_test.gd'
      - 'scripts/tests/veilleurs_combat_advanced_systems_smoke_test.gd'
      - 'scripts/tests/veilleurs_mobile_advanced_hud_smoke_test.gd'
      - 'scripts/tests/veilleurs_mobile_phone_polish_smoke_test.gd'
      - 'scripts/tests/veilleurs_mobile_combat_feel_smoke_test.gd'
      - 'scenes/Main.tscn'
      - 'scenes/tests/current_quartet_skill_data_smoke.tscn'
      - 'scenes/tests/veilleurs_combat_context_smoke.tscn'
      - 'scenes/tests/veilleurs_combat_sandbox_loop_smoke.tscn'
      - 'scenes/tests/veilleurs_systemic_skill_families_smoke.tscn'
      - 'scenes/tests/veilleurs_combat_advanced_systems_smoke.tscn'
      - 'scenes/tests/veilleurs_mobile_advanced_hud_smoke.tscn'
      - 'scenes/tests/veilleurs_mobile_phone_polish_smoke.tscn'
      - 'scenes/tests/veilleurs_mobile_combat_feel_smoke.tscn'
      - '.github/workflows/veilleurs-combat-sandbox-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-context-smoke:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Import strict du projet
        run: godot --headless --path . --import --quit
      - name: Detecter la tranche Combat Sandbox
        id: sandbox
        shell: sh
        run: |
          required="scenes/tests/current_quartet_skill_data_smoke.tscn scenes/tests/veilleurs_combat_context_smoke.tscn scenes/tests/veilleurs_combat_sandbox_loop_smoke.tscn scenes/tests/veilleurs_systemic_skill_families_smoke.tscn scenes/tests/veilleurs_combat_advanced_systems_smoke.tscn scenes/tests/veilleurs_mobile_advanced_hud_smoke.tscn scenes/tests/veilleurs_mobile_phone_polish_smoke.tscn scenes/tests/veilleurs_mobile_combat_feel_smoke.tscn"
          missing=""
          for file in $required; do
            if [ ! -f "$file" ]; then missing="$missing $file"; fi
          done
          if [ -n "$missing" ]; then
            echo "Combat Sandbox non present sur cette branche empilee; smokes differes jusqu'a la branche qui livre les scenes:$missing"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Quatuor actuel - 3 arbres x 15 competences chacun
        if: steps.sandbox.outputs.available == 'true'
        run: timeout 60s godot --headless --path . res://scenes/tests/current_quartet_skill_data_smoke.tscn
      - name: Combat Sandbox 0.1 - inspection contextuelle
        if: steps.sandbox.outputs.available == 'true'
        run: timeout 60s godot --headless --path . res://scenes/tests/veilleurs_combat_context_smoke.tscn
      - name: Combat Sandbox 0.1 - boucle de combat complete
        if: steps.sandbox.outputs.available == 'true'
        run: timeout 60s godot --headless --path . res://scenes/tests/veilleurs_combat_sandbox_loop_smoke.tscn
      - name: Combat Sandbox 0.1 - familles de competences systemiques
        if: steps.sandbox.outputs.available == 'true'
        run: timeout 60s godot --headless --path . res://scenes/tests/veilleurs_systemic_skill_families_smoke.tscn
      - name: Combat Sandbox 0.1 - formation controle synergies et ultimes
        if: steps.sandbox.outputs.available == 'true'
        run: timeout 60s godot --headless --path . res://scenes/tests/veilleurs_combat_advanced_systems_smoke.tscn
      - name: Combat Sandbox 0.1 - HUD mobile avance
        if: steps.sandbox.outputs.available == 'true'
        run: timeout 60s godot --headless --path . res://scenes/tests/veilleurs_mobile_advanced_hud_smoke.tscn
      - name: Combat Sandbox 0.1 - polish telephone
        if: steps.sandbox.outputs.available == 'true'
        run: timeout 60s godot --headless --path . res://scenes/tests/veilleurs_mobile_phone_polish_smoke.tscn
      - name: Combat Sandbox 0.1 - ressenti mobile low-tap
        if: steps.sandbox.outputs.available == 'true'
        run: timeout 60s godot --headless --path . res://scenes/tests/veilleurs_mobile_combat_feel_smoke.tscn
