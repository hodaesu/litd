name: Veilleurs Combat Sandbox Smoke

on:
  pull_request:
    paths:
      - 'data/veilleurs/canonical_roster.json'
      - 'data/veilleurs/skills/mathilde.json'
      - 'data/veilleurs/skills/marec.json'
      - 'data/veilleurs/skills/anouk.json'
      - 'data/veilleurs/skills/aurelien.json'
      - 'scripts/ui/main_v44.gd'
      - 'scripts/ui/main_v45.gd'
      - 'scripts/ui/main_v46.gd'
      - 'scripts/ui/main_v47.gd'
      - 'scripts/ui/main_v48.gd'
      - 'scripts/ui/main_v49.gd'
      - 'scripts/ui/main_v50.gd'
      - 'scenes/Main.tscn'
      - 'scenes/tests/ui_player_journey_smoke.tscn'
      - 'scenes/tests/canonical_ui_smoke.tscn'
      - 'scenes/tests/canonical_ux_smoke.tscn'
      - 'scenes/tests/mobile_touch_smoke.tscn'
      - 'scenes/tests/veilleurs_vs001_playable_smoke.tscn'
      - 'scenes/tests/veilleurs_canonical_skills_corpses_smoke.tscn'
      - 'scenes/tests/qa_validation_room_smoke.tscn'
      - '.github/workflows/veilleurs-combat-sandbox-smoke.yml'
  workflow_dispatch:

concurrency:
  group: veilleurs-combat-sandbox-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  combat-context-smoke:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Import strict du projet
        run: godot --headless --path . --import --quit
      - name: Parcours UI joueur - combat et retour
        run: timeout 90s godot --headless --path . res://scenes/tests/ui_player_journey_smoke.tscn
      - name: Interface canonique - HUD et interactions
        run: timeout 90s godot --headless --path . res://scenes/tests/canonical_ui_smoke.tscn
      - name: UX canonique - feedbacks et états tactiles
        run: timeout 90s godot --headless --path . res://scenes/tests/canonical_ux_smoke.tscn
      - name: Mobile tactile - cibles et interactions
        run: timeout 90s godot --headless --path . res://scenes/tests/mobile_touch_smoke.tscn
      - name: Veilleurs VS001 jouable - exploration et combats
        run: timeout 90s godot --headless --path . res://scenes/tests/veilleurs_vs001_playable_smoke.tscn
      - name: Veilleurs canon - compétences et cadavres
        run: timeout 90s godot --headless --path . res://scenes/tests/veilleurs_canonical_skills_corpses_smoke.tscn
      - name: Salle QA intégrée - états et boucle joueur
        run: timeout 90s godot --headless --path . res://scenes/tests/qa_validation_room_smoke.tscn
