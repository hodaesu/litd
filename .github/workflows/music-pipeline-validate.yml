name: Music Pipeline Validate

on:
  pull_request:
    paths:
      - "tools/music_pipeline/**"
      - ".github/workflows/music-pipeline-validate.yml"
  push:
    branches:
      - main
    paths:
      - "tools/music_pipeline/**"
      - ".github/workflows/music-pipeline-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile coordinator
        run: python -m py_compile tools/music_pipeline/build_music.py
      - name: Validate production contract
        run: python tools/music_pipeline/build_music.py validate-config
