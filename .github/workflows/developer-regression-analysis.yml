name: Developer Regression Analysis

on:
  workflow_run:
    workflows: ["Developer Autotest"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: developer-regression-analysis-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  regression-analysis:
    if: ${{ github.event_name == 'workflow_dispatch' || ((github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request') && github.event.workflow_run.conclusion != 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Préparer les rapports
        run: mkdir -p reports
      - name: Télécharger les artefacts du banc développeur
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: developer-autotest-*
          path: reports
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: "Bot v14 : triage transversal des échecs"
        run: python tools/qa/bot_v14_failure_triage.py
      - name: "Bot v15 : réduction des cas de fuzzing"
        if: always()
        run: python tools/qa/bot_v15_case_minimizer.py
      - name: "Bot v16 : garde statistique de régression"
        if: always()
        run: python tools/qa/bot_v16_balance_regression_guard.py
      - name: Publier les diagnostics v14-v16
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: developer-autotest-regression-analysis
          retention-days: 14
          path: |
            reports/player-bot-v14-failure-triage.json
            reports/player-bot-v15-case-minimizer.json
            reports/player-bot-v16-balance-regression-guard.json
