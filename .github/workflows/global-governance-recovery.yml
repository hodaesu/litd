name: Global Governance Recovery Contract

on:
  pull_request:
    paths:
      - 'tools/quality/global_governance_recovery_gate.py'
      - 'tests/python/test_global_governance_recovery_gate.py'
      - 'docs/knowledge/GLOBAL_GOVERNANCE_COMPROMISE_RECOVERY_P0.md'
      - '.github/workflows/global-governance-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run recovery contract tests
        run: python -m pytest -q tests/python/test_global_governance_recovery_gate.py
      - name: Assert recovery has no mutation authority
        run: |
          grep -q 'automatic_resume_allowed.*False' tools/quality/global_governance_recovery_gate.py
          grep -q 'automatic_credential_restore_allowed.*False' tools/quality/global_governance_recovery_gate.py
          grep -q 'automatic_core_write_allowed.*False' tools/quality/global_governance_recovery_gate.py
          grep -q 'automatic_cross_project_propagation_allowed.*False' tools/quality/global_governance_recovery_gate.py
