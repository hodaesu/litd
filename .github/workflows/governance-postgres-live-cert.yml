name: Governance PostgreSQL Live Certification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  live-certification:
    name: PostgreSQL Live Certification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: governance-live-cert
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fail closed when live database secret is absent
        shell: bash
        env:
          GOVERNANCE_DATABASE_URL: ${{ secrets.GOVERNANCE_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${GOVERNANCE_DATABASE_URL:-}" ]; then
            echo "GOVERNANCE_DATABASE_URL is not configured for governance-live-cert" >&2
            exit 2
          fi

      - name: Install PostgreSQL client dependency
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Run synthetic live certification
        env:
          GOVERNANCE_DATABASE_URL: ${{ secrets.GOVERNANCE_DATABASE_URL }}
        run: python -m tools.quality.postgres_registry_live_cert

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: governance-postgres-live-certification-${{ github.sha }}
          path: artifacts/governance/postgres-live-certification.json
          if-no-files-found: error
          retention-days: 90
