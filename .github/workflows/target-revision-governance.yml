name: Target Revision Governance

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/knowledge/design-targets.json'
      - 'docs/knowledge/target-drift-baseline-v1.json'
      - 'docs/knowledge/target-drift-budgets.json'
      - 'docs/knowledge/target-history/**'
      - 'tools/quality/target_revision_guard.py'
      - 'tools/quality/target_drift_detector.py'
      - 'tools/quality/target_drift_budget.py'
      - 'tools/quality/target_history.py'
      - 'tests/python/test_target_revision_guard.py'
      - 'tests/python/test_target_drift_detector.py'
      - 'tests/python/test_target_drift_budget.py'
      - 'tests/python/test_target_history.py'
      - 'docs/knowledge/decisions/target-revisions/**'
      - '.github/workflows/target-revision-governance.yml'
  pull_request:
    paths:
      - 'docs/knowledge/design-targets.json'
      - 'docs/knowledge/target-drift-baseline-v1.json'
      - 'docs/knowledge/target-drift-budgets.json'
      - 'docs/knowledge/target-history/**'
      - 'docs/knowledge/guardian-rules.yml'
      - 'data/roguelike/balance_targets.json'
      - 'data/roguelike/balance_matrix.json'
      - 'data/roguelike/roguelike_rules.json'
      - 'docs/knowledge/decisions/target-revisions/**'
      - 'scripts/**'
      - 'scenes/**'
      - 'data/characters/**'
      - 'data/enemies/**'
      - 'data/items/**'
      - 'data/equipment/**'
      - 'data/skills/**'
      - 'addons/**'
      - 'project.godot'
      - 'tools/quality/target_revision_guard.py'
      - 'tools/quality/target_drift_detector.py'
      - 'tools/quality/target_drift_budget.py'
      - 'tools/quality/target_history.py'
      - 'tests/python/test_target_revision_guard.py'
      - 'tests/python/test_target_drift_detector.py'
      - 'tests/python/test_target_drift_budget.py'
      - 'tests/python/test_target_history.py'
      - '.github/workflows/target-revision-governance.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  guard-target-revisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Target revision, longitudinal drift and history tests
        run: >-
          python -m pytest -q
          tests/python/test_target_revision_guard.py
          tests/python/test_target_drift_detector.py
          tests/python/test_target_drift_budget.py
          tests/python/test_target_history.py
      - name: Collect Pull Request changed files
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > reports-target-revision-files.txt
          git diff --name-status "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > reports-target-revision-status.txt
          cat reports-target-revision-files.txt
      - name: Protect frozen drift baseline
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          baseline='docs/knowledge/target-drift-baseline-v1.json'
          base_sha='${{ github.event.pull_request.base.sha }}'
          if grep -qx "$baseline" reports-target-revision-files.txt; then
            if git cat-file -e "${base_sha}:${baseline}" 2>/dev/null; then
              echo 'Frozen target drift baseline cannot be modified by an ordinary PR. Create a new baseline version through explicit governance instead.' >&2
              exit 1
            fi
            status="$(awk -v path="$baseline" '$2 == path {print $1}' reports-target-revision-status.txt | tail -n 1)"
            if [ "$status" != 'A' ]; then
              echo 'A missing frozen baseline may only be bootstrapped as a new file during reconciliation.' >&2
              exit 1
            fi
            echo 'Frozen baseline bootstrap accepted because the PR base does not contain the baseline.'
          fi
      - name: Enforce append-only target history
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          if awk '$2 ~ /^docs\/knowledge\/target-history\/.*\.json$/ && $1 !~ /^A/ {print; bad=1} END {exit bad ? 0 : 1}' reports-target-revision-status.txt; then
            echo 'Existing target-history snapshots are append-only and cannot be modified, renamed or deleted.' >&2
            exit 1
          fi
          if grep -qx 'docs/knowledge/design-targets.json' reports-target-revision-files.txt; then
            if ! awk '$1 ~ /^A/ && $2 ~ /^docs\/knowledge\/target-history\/.*\.json$/ {found=1} END {exit found ? 0 : 1}' reports-target-revision-status.txt; then
              echo 'A canonical target change must add a new chained target-history snapshot.' >&2
              exit 1
            fi
          fi
      - name: Enforce governance-only target revisions
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          base_sha='${{ github.event.pull_request.base.sha }}'
          target_registry='docs/knowledge/design-targets.json'
          if ! git cat-file -e "${base_sha}:${target_registry}" 2>/dev/null; then
            echo '{"status":"PASS","reason":"target_governance_bootstrap_from_reconciled_history"}' > reports/target-revision-guard.json
            echo 'Target governance bootstrap accepted because the PR base has no canonical target registry.'
            exit 0
          fi
          mapfile -t proposal_files < <(grep '^docs/knowledge/decisions/target-revisions/.*\.json$' reports-target-revision-files.txt || true)
          args=(--changed-files reports-target-revision-files.txt --output reports/target-revision-guard.json)
          for proposal in "${proposal_files[@]:-}"; do
            if [ -f "$proposal" ]; then
              args+=(--proposal "$proposal")
            fi
          done
          python -m tools.quality.target_revision_guard "${args[@]}"
      - name: Detect permissive target drift per proposal
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/target-drift
          mapfile -t proposal_files < <(grep '^docs/knowledge/decisions/target-revisions/.*\.json$' reports-target-revision-files.txt || true)
          for proposal in "${proposal_files[@]:-}"; do
            if [ -f "$proposal" ]; then
              name="$(basename "$proposal" .json)"
              python -m tools.quality.target_drift_detector "$proposal" \
                --output "reports/target-drift/${name}.drift.json"
            fi
          done
      - name: Evaluate cumulative drift from frozen baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m tools.quality.target_drift_budget \
            --baseline docs/knowledge/target-drift-baseline-v1.json \
            --current docs/knowledge/design-targets.json \
            --budgets docs/knowledge/target-drift-budgets.json \
            --output reports/target-drift-budget.json
      - name: Validate target trajectory history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          mapfile -t snapshots < <(find docs/knowledge/target-history -type f -name '*.json' | sort)
          if [ "${#snapshots[@]}" -eq 0 ]; then
            echo 'Target history is empty.' >&2
            exit 1
          fi
          python -m tools.quality.target_history "${snapshots[@]}" \
            --output reports/target-trajectory.json
      - name: Ensure latest history snapshot matches current canonical targets
        shell: python
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          import json
          from pathlib import Path
          from tools.quality.target_history import registry_hash
          registry = json.loads(Path('docs/knowledge/design-targets.json').read_text(encoding='utf-8'))
          snapshots = sorted(Path('docs/knowledge/target-history').glob('*.json'))
          latest = json.loads(snapshots[-1].read_text(encoding='utf-8'))
          assert latest['registry_hash'] == registry_hash(registry), 'Latest history snapshot does not match current canonical target registry'
          assert latest['core_write_allowed'] is False
      - name: Enforce explicit budget registry policy
        shell: python
        run: |
          import json
          from pathlib import Path
          payload = json.loads(Path('docs/knowledge/target-drift-budgets.json').read_text(encoding='utf-8'))
          policy = payload['policy']
          assert policy['missing_budget_action'] == 'REVIEW_REQUIRED'
          assert policy['invented_default_budget_forbidden'] is True
          assert policy['core_write_allowed'] is False
      - name: Upload target revision guard evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-revision-governance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/target-revision-guard.json
            reports/target-drift/*.drift.json
            reports/target-drift-budget.json
            reports/target-trajectory.json
          if-no-files-found: warn
