name: Remanence Smoke

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: remanence-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  remanence-smoke:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Import strict du projet
        run: godot --headless --path . --import --quit
      - name: Rémanence des Veilleurs
        run: godot --headless --path . res://scenes/tests/remanence_smoke.tscn
