name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les dépendances QA
        run: python -m pip install -r requirements-dev.txt
      - name: Tests Python
        run: python -m pytest
      - name: Audit des données de base
        run: python -m tools.qa.audit
      - name: Audit transversal campagne et systèmes
        run: python -m tools.qa.cross_system_audit
      - name: Audit progression, économie et NG+
        run: python -m tools.qa.balance_audit
      - name: Audit tours complets et effets de talents
        run: python -m tools.qa.combat_turn_audit
      - name: Simulation combat v2, économie et cycles NG+
        run: python -m tools.qa.combat_economy_sim_v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-reports
          path: reports/

  godot-smoke:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Importer le projet
        run: godot --headless --path . --import --quit
      - name: Compiler et lancer le smoke test
        run: godot --headless --path . --script res://scripts/core/smoke_test.gd
