name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m tools.qa.audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-reports
          path: reports/

  godot-smoke:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Importer le projet
        run: godot --headless --path . --import --quit
      - name: Compiler et lancer le smoke test
        run: godot --headless --path . --script res://scripts/core/smoke_test.gd
