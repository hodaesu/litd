name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les dépendances QA
        run: python -m pip install -r requirements-dev.txt
      - name: Préparer les rapports QA
        run: mkdir -p reports
      - name: Tests Python
        run: python -m pytest -q --tb=short --junitxml=reports/pytest.xml
      - name: Audit des données de base
        run: python -m tools.qa.audit
      - name: Audit transversal campagne et systèmes
        run: python -m tools.qa.cross_system_audit
      - name: Audit progression, économie et NG+
        run: python -m tools.qa.balance_audit
      - name: Audit tours complets et effets de talents
        run: python -m tools.qa.combat_turn_audit
      - name: Audit rangs, déplacements et synergies tactiques
        run: python -m tools.qa.tactical_combat_audit
      - name: Audit démembrements tactiques
        run: python -m tools.qa.dismemberment_audit
      - name: Audit poussées, tractions et phases de boss
        run: python -m tools.qa.displacement_combat_audit
      - name: Audit familles ennemies et réactions de membres
        run: python -m tools.qa.enemy_family_tactics_audit
      - name: Audit anatomie avancée, capture, psychologie et Blender
        run: python -m tools.qa.anatomy_system_audit
      - name: Audit psychologie de combat
        run: python -m tools.qa.psychology_combat_audit
      - name: Audit psychologie sociale du combat
        run: python -m tools.qa.psychology_social_combat_audit
      - name: Audit relations persistantes entre héros
        run: python -m tools.qa.hero_relationships_audit
      - name: Audit mémoire des décisions et convictions
        run: python -m tools.qa.decision_memory_audit
      - name: Audit mémoire des décisions de terrain
        run: python -m tools.qa.field_memory_audit
      - name: Audit rencontres réactives de terrain
        run: python -m tools.qa.field_encounter_audit
      - name: Audit Sanctuaire vivant, rumeurs et quêtes émergentes
        run: python -m tools.qa.community_network_audit
      - name: Audit bibliothèque narrative et quêtes secondaires
        run: python -m tools.qa.narrative_library_audit
      - name: Audit dialogues, voix et mise en scène
        run: python -m tools.qa.dialogue_library_audit
      - name: Audit bibliothèque musicale, licences et cues narratifs
        run: python -m tools.qa.music_library_audit
      - name: Audit bâtiments interactifs du Sanctuaire
        run: python -m tools.qa.sanctuary_buildings_audit
      - name: Générer les jobs Blender anatomiques
        run: python -m tools.blender.generate_dismemberment_jobs --output reports/dismemberment-jobs.json
      - name: Simulation combat v2, économie et cycles NG+
        run: python -m tools.qa.combat_economy_sim_v2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-reports
          path: reports/

  godot-smoke:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      # Le wrapper lance godot --headless et couvre notamment res://scripts/core/smoke_test.gd via la scène core_smoke.tscn, puis les parcours critiques supplémentaires.
      - name: Compilation stricte et parcours critique Godot
        run: bash tools/build/run_godot_ci.sh
