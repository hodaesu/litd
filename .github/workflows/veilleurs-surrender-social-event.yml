name: Veilleurs Surrender Social Event

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surrender-social-event:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import strict du projet
        run: godot --headless --path . --import --quit
      - name: Rencontres sociales après reddition
        run: godot --headless --path . res://scenes/tests/veilleurs_surrender_social_event_smoke.tscn
