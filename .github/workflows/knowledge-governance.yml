name: Knowledge Governance

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/knowledge/**'
      - 'docs/BIBLIOTHEQUE_GOUVERNANCE.md'
      - 'tools/quality/library_trieur.py'
      - 'tools/quality/veilleur_v2_ingest.py'
      - 'tools/quality/evidence_ledger.py'
      - 'tools/quality/provenance_chain.py'
      - 'tools/quality/github_provenance_adapter.py'
      - 'tools/quality/measurement_collector.py'
      - 'tools/quality/measurement_comparator.py'
      - 'tools/quality/design_target_evaluator.py'
      - 'tools/quality/telemetry_target_mapper.py'
      - 'tools/quality/validate_knowledge.py'
      - 'tests/python/test_library_trieur.py'
      - 'tests/python/test_veilleur_v2_ingest.py'
      - 'tests/python/test_evidence_ledger.py'
      - 'tests/python/test_veilleur_v2_persistent_ingest.py'
      - 'tests/python/test_provenance_chain.py'
      - 'tests/python/test_github_provenance_adapter.py'
      - 'tests/python/test_measurement_collector.py'
      - 'tests/python/test_measurement_comparator.py'
      - 'tests/python/test_design_target_evaluator.py'
      - 'tests/python/test_telemetry_target_mapper.py'
      - '.github/workflows/measurement-provenance.yml'
      - '.github/workflows/knowledge-governance.yml'
  pull_request:
    paths:
      - 'docs/knowledge/**'
      - 'docs/BIBLIOTHEQUE_GOUVERNANCE.md'
      - 'tools/quality/library_trieur.py'
      - 'tools/quality/veilleur_v2_ingest.py'
      - 'tools/quality/evidence_ledger.py'
      - 'tools/quality/provenance_chain.py'
      - 'tools/quality/github_provenance_adapter.py'
      - 'tools/quality/measurement_collector.py'
      - 'tools/quality/measurement_comparator.py'
      - 'tools/quality/design_target_evaluator.py'
      - 'tools/quality/telemetry_target_mapper.py'
      - 'tools/quality/validate_knowledge.py'
      - 'tests/python/test_library_trieur.py'
      - 'tests/python/test_veilleur_v2_ingest.py'
      - 'tests/python/test_evidence_ledger.py'
      - 'tests/python/test_veilleur_v2_persistent_ingest.py'
      - 'tests/python/test_provenance_chain.py'
      - 'tests/python/test_github_provenance_adapter.py'
      - 'tests/python/test_measurement_collector.py'
      - 'tests/python/test_measurement_comparator.py'
      - 'tests/python/test_design_target_evaluator.py'
      - 'tests/python/test_telemetry_target_mapper.py'
      - '.github/workflows/measurement-provenance.yml'
      - '.github/workflows/knowledge-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Installer les dépendances QA
        run: python -m pip install -r requirements-dev.txt
      - name: Knowledge Guardian
        run: python tools/quality/validate_knowledge.py
      - name: Trieur routing and Core boundary tests
        run: python -m pytest -q tests/python/test_library_trieur.py
      - name: VEILLEUR V2 ingress validation, integrity and dedup tests
        run: python -m pytest -q tests/python/test_veilleur_v2_ingest.py
      - name: Persistent evidence registry and immutable ledger tests
        run: python -m pytest -q tests/python/test_evidence_ledger.py tests/python/test_veilleur_v2_persistent_ingest.py
      - name: End-to-end provenance chain tests
        run: python -m pytest -q tests/python/test_provenance_chain.py
      - name: GitHub commit and CI provenance bridge tests
        run: python -m pytest -q tests/python/test_github_provenance_adapter.py
      - name: Telemetry target mapper tests
        run: python -m pytest -q tests/python/test_telemetry_target_mapper.py
      - name: Telemetry measurement collector tests
        run: python -m pytest -q tests/python/test_measurement_collector.py
      - name: Before-after measurement comparator tests
        run: python -m pytest -q tests/python/test_measurement_comparator.py
      - name: LITD design target evaluator tests
        run: python -m pytest -q tests/python/test_design_target_evaluator.py
      - name: Validate canonical design target registry
        shell: python
        run: |
          from tools.quality.design_target_evaluator import load_targets
          registry = load_targets('docs/knowledge/design-targets.json')
          assert registry['governance']['core_write_allowed'] is False
          assert registry['targets']['expedition.duration_minutes']['min'] == 35.0
          assert registry['targets']['expedition.duration_minutes']['max'] == 45.0
          assert registry['targets']['performance.frame_time_ms_p95']['provisional'] is True
      - name: Capture real GitHub run evidence
        shell: python
        run: |
          import json, os
          from pathlib import Path
          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "job": os.environ["GITHUB_JOB"],
              "ref": os.environ["GITHUB_REF"],
              "server_url": os.environ["GITHUB_SERVER_URL"],
          }
          Path("reports").mkdir(exist_ok=True)
          Path("reports/knowledge-governance-github-evidence.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2), encoding="utf-8"
          )
      - name: Upload GitHub provenance evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-governance-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/knowledge-governance-github-evidence.json
      - name: Verify governance invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'return False' tools/quality/library_trieur.py
          grep -q 'QUARANTINE' tools/quality/library_trieur.py
          grep -q 'return False' tools/quality/veilleur_v2_ingest.py
          grep -q 'content_hash_mismatch' tools/quality/veilleur_v2_ingest.py
          grep -q 'duplicate_canonical_content' tools/quality/veilleur_v2_ingest.py
          grep -q 'decision_ledger_no_update' tools/quality/evidence_ledger.py
          grep -q 'decision_ledger_no_delete' tools/quality/evidence_ledger.py
          grep -q 'verify_chain' tools/quality/evidence_ledger.py
          grep -q 'provenance_no_update' tools/quality/provenance_chain.py
          grep -q 'provenance_no_delete' tools/quality/provenance_chain.py
          grep -q 'CORE_DECISION' tools/quality/provenance_chain.py
          grep -q 'GITHUB_SHA' tools/quality/github_provenance_adapter.py
          grep -q 'GITHUB_RUN_ID' tools/quality/github_provenance_adapter.py
          grep -q 'MEASUREMENT_CANDIDATE' tools/quality/measurement_collector.py
          grep -q 'canonical_metrics' tools/quality/measurement_collector.py
          grep -q 'requires_matching_CORE_DECISION_COMMIT_TEST_chain' tools/quality/measurement_collector.py
          grep -q 'NO_SIGNIFICANT_CHANGE' tools/quality/measurement_comparator.py
          grep -q 'INCONCLUSIVE' tools/quality/measurement_comparator.py
          grep -q 'core_write_allowed.*False' tools/quality/measurement_comparator.py
          grep -q 'FARTHER_FROM_TARGET' tools/quality/design_target_evaluator.py
          grep -q 'DESIGN_REGRESSION' tools/quality/design_target_evaluator.py
          grep -q 'core_write_allowed.*False' tools/quality/design_target_evaluator.py
          grep -q 'outcomes.retreat_rate' tools/quality/telemetry_target_mapper.py
          grep -q 'campaign.boss_rounds' tools/quality/telemetry_target_mapper.py
          grep -q 'CANONICAL_DESIGN_TARGETS' docs/knowledge/design-targets.json
          grep -q 'La bibliothèque ne modifie jamais directement le Core' docs/BIBLIOTHEQUE_GOUVERNANCE.md
