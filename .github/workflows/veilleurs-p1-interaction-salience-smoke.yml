name: Veilleurs P1 Interaction Salience Smoke

on:
  pull_request:
    paths:
      - 'scripts/core/environment_interaction_contract.gd'
      - 'scripts/world/exploration_party_controller.gd'
      - 'scripts/tests/interaction_salience_smoke_test.gd'
      - 'scenes/tests/interaction_salience_smoke.tscn'
      - '.github/workflows/veilleurs-p1-interaction-salience-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interaction-salience:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v6
      - name: Strict Godot import
        run: godot --headless --path . --import --quit
      - name: Interaction salience smoke
        run: timeout 60s godot --headless --path . res://scenes/tests/interaction_salience_smoke.tscn
