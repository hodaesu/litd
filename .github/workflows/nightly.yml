name: Nightly QA

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m tools.qa.audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-qa-${{ github.run_number }}
          path: reports/
          retention-days: 30
