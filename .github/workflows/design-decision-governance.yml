name: Design Decision Governance

on:
  push:
    branches: [main, develop]
    paths:
      - 'tools/quality/design_decision_resolution.py'
      - 'tests/python/test_design_decision_resolution.py'
      - 'docs/knowledge/decisions/**'
      - '.github/workflows/design-decision-governance.yml'
  pull_request:
    paths:
      - 'tools/quality/design_decision_resolution.py'
      - 'tests/python/test_design_decision_resolution.py'
      - 'docs/knowledge/decisions/**'
      - '.github/workflows/design-decision-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-resolutions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Decision resolution contract tests
        run: python -m pytest -q tests/python/test_design_decision_resolution.py
      - name: Validate committed resolution documents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/design-decision-resolutions
          found=0
          while IFS= read -r -d '' resolution; do
            found=1
            name="$(basename "$resolution" .json)"
            python -m tools.quality.design_decision_resolution "$resolution" \
              --output "reports/design-decision-resolutions/${name}.receipt.json"
          done < <(find docs/knowledge/decisions -type f -name '*.json' ! -name '*.example.json' -print0 2>/dev/null || true)
          if [ "$found" -eq 0 ]; then
            echo 'No committed design decision resolutions to validate.'
          fi
      - name: Enforce no direct Core-write authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'LITD_DESIGN_DECISION_RESOLUTION' tools/quality/design_decision_resolution.py
          grep -q 'direct_core_write_forbidden' tools/quality/design_decision_resolution.py
          grep -q 'core_write_allowed.*False' tools/quality/design_decision_resolution.py
          if grep -R '"decision"[[:space:]]*:[[:space:]]*"APPLY_CORE_CHANGE"' docs/knowledge/decisions --include='*.json' 2>/dev/null; then
            echo 'Forbidden APPLY_CORE_CHANGE decision found.' >&2
            exit 1
          fi
      - name: Upload validated decision receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-decision-resolution-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/design-decision-resolutions/*.receipt.json
          if-no-files-found: warn
