name: Veilleurs VS001 Authored Salience Smoke

on:
  pull_request:
    paths:
      - 'scripts/world/veilleurs_vs001_interaction_proxy.gd'
      - 'scripts/tests/vs001_authored_salience_smoke_test.gd'
      - 'scenes/tests/vs001_authored_salience_smoke.tscn'
      - '.github/workflows/veilleurs-vs001-authored-salience-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vs001-authored-salience:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v7
      - name: Strict Godot import
        run: godot --headless --path . --import --quit
      - name: VS001 authored salience smoke
        run: timeout 60s godot --headless --path . res://scenes/tests/vs001_authored_salience_smoke.tscn
