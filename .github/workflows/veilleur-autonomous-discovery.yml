name: Veilleur Autonomous Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: veilleur-autonomous-discovery
  cancel-in-progress: false

jobs:
  discover-and-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install QA dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate autonomous Veilleur contracts
        run: >-
          python -m pytest -q
          tests/python/test_autonomous_veilleur.py
          tests/python/test_veilleur_triage.py
          tests/python/test_veilleur_v2_ingest.py
          tests/python/test_evidence_ledger.py
          tests/python/test_library_trieur.py

      - name: Restore latest durable Veilleur ledger when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          current_run = int(os.environ['GITHUB_RUN_ID'])
          url = f'https://api.github.com/repos/{repo}/actions/artifacts?name=veilleur-ledger&per_page=100'
          req = urllib.request.Request(url, headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.load(response)
          artifacts = [a for a in data.get('artifacts', []) if not a.get('expired') and int(a.get('workflow_run', {}).get('id', 0)) != current_run]
          if not artifacts:
              print('No previous Veilleur ledger: starting GENESIS ledger.')
              raise SystemExit(0)
          latest = max(artifacts, key=lambda a: a.get('created_at', ''))
          dl = urllib.request.Request(latest['archive_download_url'], headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(dl, timeout=30) as response:
              payload = response.read()
          open('/tmp/veilleur-ledger.zip', 'wb').write(payload)
          print('Restored ledger artifact', latest['id'])
          PY
          if [ -s /tmp/veilleur-ledger.zip ]; then
            python - <<'PY'
            from pathlib import Path
            from zipfile import ZipFile
            archive = Path('/tmp/veilleur-ledger.zip')
            destination = Path('reports/veilleur-evidence-ledger.sqlite3')
            with ZipFile(archive) as bundle:
                members = bundle.infolist()
                if len(members) != 1 or members[0].filename != 'veilleur-evidence-ledger.sqlite3':
                    raise SystemExit('Invalid ledger artifact contents')
                member = members[0]
                if member.is_dir() or member.file_size > 50 * 1024 * 1024:
                    raise SystemExit('Invalid ledger artifact size or type')
                mode = member.external_attr >> 16
                if mode and (mode & 0o170000) not in {0, 0o100000}:
                    raise SystemExit('Ledger artifact must be a regular file')
                destination.write_bytes(bundle.read(member))
            PY
          fi

      - name: Run read-only autonomous discovery
        run: >-
          python -m tools.quality.autonomous_veilleur
          --registry docs/knowledge/source-registry.json
          --output reports/veilleur-discovery.json

      - name: Run governed ingress, deduplication, routing and impact pre-analysis
        run: >-
          python -m tools.quality.veilleur_triage
          --input reports/veilleur-discovery.json
          --ledger reports/veilleur-evidence-ledger.sqlite3
          --output reports/veilleur-triage.json

      - name: Assert hard governance boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          discovery = json.loads(Path('reports/veilleur-discovery.json').read_text(encoding='utf-8'))
          triage = json.loads(Path('reports/veilleur-triage.json').read_text(encoding='utf-8'))
          assert discovery['core_write_allowed'] is False
          assert discovery['automatic_library_write_allowed'] is False
          assert triage['core_write_allowed'] is False
          assert triage['automatic_library_write_allowed'] is False
          assert triage['automatic_core_change_candidate_allowed'] is False
          assert triage['ledger_chain_valid'] is True
          assert triage['next_stage'] == 'GOVERNED_LIBRARY_REVIEW_AND_IMPACT_DECISION'
          print('discovered:', discovery['candidate_count'])
          print('triage:', triage['summary'])
          PY

      - name: Upload discovery and triage evidence
        uses: actions/upload-artifact@v4
        with:
          name: veilleur-governed-batch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/veilleur-discovery.json
            reports/veilleur-triage.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload append-only Veilleur ledger for next run
        uses: actions/upload-artifact@v4
        with:
          name: veilleur-ledger
          path: reports/veilleur-evidence-ledger.sqlite3
          if-no-files-found: error
          retention-days: 90
