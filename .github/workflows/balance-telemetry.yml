name: Balance Telemetry

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/core/**'
      - 'tools/qa/roguelike_telemetry_sim_v2.py'
      - 'tools/qa/balance_matrix_sim_v3.py'
      - 'tools/qa/veilleurs_vs001_balance_sim.py'
      - 'tools/qa/balance_lab_v03_calibrated.py'
      - '.github/workflows/balance-telemetry.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      runs:
        description: "Nombre d'expéditions Monte Carlo du donjon étalon"
        required: false
        default: "12000"
      matrix_mode:
        description: "Profondeur de la matrice globale"
        required: false
        type: choice
        options:
          - quick
          - exhaustive
        default: exhaustive

concurrency:
  group: balance-telemetry-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pr-balance-smoke:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Préparer les rapports rapides
        run: mkdir -p reports
      - name: Smoke télémétrie roguelike
        run: >-
          python -m tools.qa.roguelike_telemetry_sim_v2
          --runs 1500
          --report reports/roguelike-telemetry.json
          --csv reports/roguelike-telemetry.csv
          --strict
      - name: Smoke matrice globale
        run: >-
          python -m tools.qa.balance_matrix_sim_v3
          --mode quick
          --report reports/balance-matrix.json
          --csv reports/balance-matrix.csv
          --raw-csv-gz reports/balance-matrix-cells.csv.gz
          --strict
      - name: Smoke compatibilité vertical slice
        run: >-
          python -m tools.qa.veilleurs_vs001_balance_sim
          --runs 1200
          --report reports/veilleurs-vertical-slice-compatibility.json
          --strict
      - name: Smoke BalanceLab v0.3
        run: >-
          python -m tools.qa.balance_lab_v03_calibrated
          --runs 2000
          --report reports/balance-lab-v03.json
          --csv reports/balance-lab-v03-runs.csv
          --markdown reports/balance-lab-v03.md
          --strict
      - name: Publier les rapports rapides
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: balance-telemetry-pr-smoke
          path: reports/

  roguelike-telemetry:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Simuler les expéditions LITD
        env:
          TELEMETRY_RUNS: ${{ github.event.inputs.runs || '12000' }}
        run: >-
          python -m tools.qa.roguelike_telemetry_sim_v2
          --runs "$TELEMETRY_RUNS"
          --report reports/roguelike-telemetry.json
          --csv reports/roguelike-telemetry.csv
          --strict
      - name: Publier les rapports d'équilibrage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: roguelike-balance-telemetry
          path: |
            reports/roguelike-telemetry.json
            reports/roguelike-telemetry.csv

  full-balance-matrix:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Couvrir niveaux, groupes, campagne, donjons et NG+
        env:
          MATRIX_MODE: ${{ github.event.inputs.matrix_mode || 'exhaustive' }}
        run: >-
          python -m tools.qa.balance_matrix_sim_v3
          --mode "$MATRIX_MODE"
          --report reports/balance-matrix.json
          --csv reports/balance-matrix.csv
          --raw-csv-gz reports/balance-matrix-cells.csv.gz
          --strict
      - name: Publier la matrice globale
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-game-balance-matrix
          path: |
            reports/balance-matrix.json
            reports/balance-matrix.csv
            reports/balance-matrix-cells.csv.gz

  veilleurs-vertical-slice-compatibility:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Simuler la compatibilité du vertical slice historique
        run: >-
          python -m tools.qa.veilleurs_vs001_balance_sim
          --runs 5000
          --report reports/veilleurs-vertical-slice-compatibility.json
          --strict
      - name: Publier le rapport de compatibilité du vertical slice
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: veilleurs-vertical-slice-compatibility
          path: reports/veilleurs-vertical-slice-compatibility.json

  balance-lab-v03:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Lancer SIM_001 BalanceLab v0.3 calibré
        env:
          BALANCE_LAB_RUNS: ${{ github.event.inputs.runs || '10000' }}
        run: >-
          python -m tools.qa.balance_lab_v03_calibrated
          --runs "$BALANCE_LAB_RUNS"
          --report reports/balance-lab-v03.json
          --csv reports/balance-lab-v03-runs.csv
          --markdown reports/balance-lab-v03.md
          --strict
      - name: Publier BalanceLab v0.3
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: balance-lab-v03-sim001
          path: |
            reports/balance-lab-v03.json
            reports/balance-lab-v03-runs.csv
            reports/balance-lab-v03.md
