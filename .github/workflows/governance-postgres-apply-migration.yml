name: Governance PostgreSQL Apply Migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_GOVERNANCE_MIGRATION_20260915110500"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: governance-postgres-schema-migration
  cancel-in-progress: false

jobs:
  apply-migration:
    name: Apply governance project-route migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: governance-live-cert
    steps:
      - name: Require explicit migration confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "APPLY_GOVERNANCE_MIGRATION_20260915110500" || {
            echo "Explicit migration confirmation did not match. Failing closed."
            exit 2
          }

      - name: Checkout exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Fail closed when database secret is absent
        shell: bash
        env:
          GOVERNANCE_DATABASE_URL: ${{ secrets.GOVERNANCE_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$GOVERNANCE_DATABASE_URL" || {
            echo "GOVERNANCE_DATABASE_URL is not configured for governance-live-cert"
            exit 2
          }

      - name: Apply exact governed migration transactionally
        shell: bash
        env:
          GOVERNANCE_DATABASE_URL: ${{ secrets.GOVERNANCE_DATABASE_URL }}
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260915110500_governance_authorized_project_routes.sql"
          test -f "$migration"
          sha256sum "$migration" | tee /tmp/governance-migration.sha256
          psql "$GOVERNANCE_DATABASE_URL" \
            --set=ON_ERROR_STOP=1 \
            --single-transaction \
            --file="$migration"

      - name: Verify authorized project routes after migration
        shell: bash
        env:
          GOVERNANCE_DATABASE_URL: ${{ secrets.GOVERNANCE_DATABASE_URL }}
        run: |
          set -euo pipefail
          verify_rpc="$(psql "$GOVERNANCE_DATABASE_URL" -Atqc "select to_regprocedure('governance_private.is_project_route_authorized(text,text)') is not null")"
          litd="$(psql "$GOVERNANCE_DATABASE_URL" -Atqc "select governance_private.is_project_route_authorized('LITD','LITD_LIBRARY')")"
          company="$(psql "$GOVERNANCE_DATABASE_URL" -Atqc "select governance_private.is_project_route_authorized('COMPANY','COMPANY_LIBRARY')")"
          cross="$(psql "$GOVERNANCE_DATABASE_URL" -Atqc "select governance_private.is_project_route_authorized('COMPANY','LITD_LIBRARY')")"
          test "$verify_rpc" = "t"
          test "$litd" = "t"
          test "$company" = "t"
          test "$cross" = "f"
          migration_sha="$(cut -d' ' -f1 /tmp/governance-migration.sha256)"
          printf '{"migration":"20260915110500_governance_authorized_project_routes.sql","migration_sha256":"%s","git_sha":"%s","authorization_rpc":true,"litd_route_authorized":true,"company_route_authorized":true,"cross_route_authorized":false}\n' \
            "$migration_sha" "$GITHUB_SHA" > governance-postgres-migration-evidence.json

      - name: Upload migration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: governance-postgres-migration-${{ github.sha }}
          path: governance-postgres-migration-evidence.json
          if-no-files-found: error
          retention-days: 90
