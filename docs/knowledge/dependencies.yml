version: 1
nodes:
  - id: engineering-method
    domain: engineering
    description: "Boucle de changement, niveaux de validation, Definition of Done et production de preuves."
  - id: core-contract
    domain: architecture
    description: "Frontières, invariants et règles d’évolution du Core."
  - id: knowledge-governance
    domain: governance
    description: "Bibliothèque vivante, Knowledge Graph et décisions traçables."
  - id: guardian
    domain: governance
    description: "Contrôle des invariants, du risque et du niveau de preuve."
  - id: ci-domains
    domain: ci
    description: "CI Godot par domaines et filet monolithique définis par ADR-0004."
  - id: combat-ranks
    domain: combat
    description: "Ordre et présentation des rangs R1 à R4."
  - id: party-placement
    domain: combat
    description: "Placement automatique selon les rôles."
  - id: combat-ui
    domain: ui
    description: "Présentation et interactions du combat."
  - id: capture
    domain: progression
    description: "Règles de capture des créatures."
  - id: capturable-creatures
    domain: data
    description: "Données des créatures capturables et de leurs arbres."
  - id: skill-trees
    domain: progression
    description: "Structure canonique des arbres de compétences."
  - id: save-load
    domain: persistence
    description: "Persistance de l'état de jeu."
  - id: deterministic-loot
    domain: loot
    description: "Reproductibilité du loot par seed et contexte."

edges:
  - from: engineering-method
    to: core-contract
    relation: depends_on
    rationale: "La méthode applique les frontières et invariants du Core."
  - from: engineering-method
    to: knowledge-governance
    relation: depends_on
    rationale: "Chaque changement charge et réinjecte les connaissances et preuves."
  - from: guardian
    to: engineering-method
    relation: constrains
    rationale: "Le niveau de risque et les invariants déterminent les validations requises."
  - from: ci-domains
    to: engineering-method
    relation: validates
    rationale: "La CI apporte une partie des preuves reproductibles de la Definition of Done."
  - from: combat-ranks
    to: party-placement
    relation: constrains
    rationale: "Le placement doit produire des rangs valides."
  - from: combat-ranks
    to: combat-ui
    relation: presented_by
    rationale: "L'UI doit présenter R1 à R4 dans l'ordre canonique."
  - from: party-placement
    to: combat-ui
    relation: reflected_by
    rationale: "L'UI doit refléter le placement tactique réel."
  - from: capturable-creatures
    to: capture
    relation: consumed_by
    rationale: "Le système de capture s'appuie sur ces données."
  - from: capturable-creatures
    to: skill-trees
    relation: implements
    rationale: "Les créatures capturables portent leurs arbres de progression."
  - from: deterministic-loot
    to: save-load
    relation: depends_on
    rationale: "La seed et le contexte doivent être persistés sans dérive."
